<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parma Ari — Reserve a Table</title><style>:root{--green:#24352d;--cream:#f8f5ef;--line:#ded9cf;--muted:#77736c}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:var(--green)}.wrap{max-width:520px;margin:auto;padding:28px 18px 40px}.brand{text-align:center;letter-spacing:.18em;font-size:12px;font-weight:700}h1{text-align:center;font-family:Georgia,serif;font-size:30px;margin:10px 0 5px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}label{display:block;font-size:14px;font-weight:700;margin:22px 0 10px}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 15px;min-width:78px;font-weight:600;color:var(--green);cursor:pointer}.btn.active{background:var(--green);color:#fff;border-color:var(--green)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.times .btn{min-width:0}.guest{display:flex;align-items:center;gap:18px}.round{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:22px;cursor:pointer}.count{font-weight:700;min-width:90px;text-align:center}.summary{border-top:1px solid var(--line);margin-top:28px;padding-top:18px}.summary div{display:flex;justify-content:space-between;margin:9px 0;font-size:14px}.summary span{color:var(--muted)}.cta{width:100%;margin-top:18px;border:0;border-radius:12px;padding:16px;background:#06c755;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.cta:disabled{opacity:.45;cursor:not-allowed}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}.phone{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}.nameinput,.phoneinput{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--green)}.phoneinput:focus{outline:none;border-color:var(--green)}.phone a{display:inline-block;margin-top:6px;color:var(--green);font-weight:700;text-decoration:none}.logo{width:300px;height:auto;display:block;margin:0 auto 10px}.logo img{width:100%;height:auto;display:block}</style></head><body><div class="wrap"><div class="logo"><img src="logo.svg" alt="Parma Trattoria Ari logo"></div><div class="brand">TRATTORIA PARMA ARI</div><h1>Reserve Your Table</h1><div class="sub">Choose your date, time and number of guests.</div><label>Choose date</label><div class="row" id="dates"></div><label>Choose time</label><div class="times" id="times"></div><label>Guests</label><div class="guest"><button class="round" id="minus">−</button><div class="count"><span id="guests">2</span> Guests</div><button class="round" id="plus">+</button></div><label>Name</label><input class="nameinput" id="customerName" type="text" autocomplete="name" placeholder="e.g. John"><label>Contact phone number</label><input class="phoneinput" id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 081-234-5678"><div class="summary"><div><span>Date</span><b id="sdate">23 Sep 2026</b></div><div><span>Time</span><b id="stime">Please select</b></div><div><span>Guests</span><b id="sguests">2</b></div><div><span>Name</span><b id="sname">Please enter</b></div><div><span>Phone</span><b id="sphone">Please enter</b></div></div><button class="cta" id="line" disabled>Continue with LINE</button><div class="note">Reservation request will be confirmed by Parma Ari via LINE OA.</div><div class="phone">Need help with your reservation?<br><a href="tel:0822949292">📞 Call Parma Ari: 082-294-9292</a></div></div><script>function getOpenDates(){const out=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<35&&out.length<12;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()!==1)out.push(x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).replace(/^0/,""));}return out}const dates=getOpenDates();let date=dates[0],time="",guests=2;function getTimes(d){const x=new Date(d+" 12:00"),day=x.getDay();if(day===2||day===3)return["12:00","12:30","13:00","13:30","14:00","14:30","17:00","17:30","18:00","18:30","19:00","19:30"];if(day===4||day===5||day===6)return["17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00"];if(day===0)return["12:00","12:30","13:00","13:30","14:00","14:30","17:00","17:30","18:00","18:30","19:00","19:30"];return[]}const datesEl=document.getElementById("dates"),timesEl=document.getElementById("times");function renderTimes(){timesEl.innerHTML="";time="";getTimes(date).forEach(t=>{let b=document.createElement("button");b.className="btn";b.textContent=t;b.onclick=()=>{time=t;document.querySelectorAll("#times .btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");update()};timesEl.appendChild(b)})}dates.forEach((d,i)=>{let b=document.createElement("button");b.className="btn"+(i===0?" active":"");b.textContent=d.replace(" 2026","");b.onclick=()=>{date=d;document.querySelectorAll("#dates .btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderTimes();update()};datesEl.appendChild(b)});renderTimes();document.getElementById("minus").onclick=()=>{if(guests>1){guests--;update()}};document.getElementById("plus").onclick=()=>{if(guests<20){guests++;update()}};function update(){const name=document.getElementById("customerName").value.trim(),phone=document.getElementById("customerPhone").value.trim();document.getElementById("sdate").textContent=date;document.getElementById("stime").textContent=time||"Please select";document.getElementById("guests").textContent=guests;document.getElementById("sguests").textContent=guests;document.getElementById("sname").textContent=name||"Please enter";document.getElementById("sphone").textContent=phone||"Please enter";document.getElementById("line").disabled=!(time&&name&&phone)}document.getElementById("customerName").addEventListener("input",update);document.getElementById("customerPhone").addEventListener("input",update);document.getElementById("line").onclick=()=>{const name=document.getElementById("customerName").value.trim(),phone=document.getElementById("customerPhone").value.trim();if(!time||!name||!phone)return;const message=`Reservation request\nName: ${name}\nDate: ${date}\nTime: ${time}\nGuests: ${guests}\nPhone: ${phone}`;window.location.href="https://line.me/R/oaMessage/%40parma.ari/?"+encodeURIComponent(message)};update();</script></body></html>
